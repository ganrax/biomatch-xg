name: Build and Release Android APK
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/BioMatch-xG-latest.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioMatch-xG-APK
          path: release_apk/BioMatch-xG-latest.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "BioMatch xG Legfrissebb Verzió"
          body: |
            🚀 **Automatikus BioMatch xG Frissítés**
            Ez az APK automatikusan fordult le a legutóbbi kódmódosításból.
            
            Közvetlen letöltés az alkalmazáson belülről vagy közvetlenül a böngészőből:
            [BioMatch-xG-latest.apk](https://github.com/${{ github.repository }}/releases/download/latest/BioMatch-xG-latest.apk)
          draft: false
          prerelease: false
          files: release_apk/BioMatch-xG-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
