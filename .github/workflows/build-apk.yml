name: Build and Release Android APK
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Prepare Signing Keystore and Environment
        run: |
          touch .env
          echo "Restoring permanent fixed debug.keystore from embedded keystore data..."
          cat << 'EOF' | base64 -d > debug.keystore

EOF
          ls -la debug.keystore
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building BioMatch xG version: $VERSION"

      - name: Rename APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/BioMatch-xG-latest.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioMatch-xG-APK
          path: release_apk/BioMatch-xG-latest.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "BioMatch xG v${{ env.APP_VERSION }}"
          body: |
            🚀 **Automatikus BioMatch xG Frissítés (v${{ env.APP_VERSION }})**
            Ez az APK automatikusan fordult le a legutóbbi kódmódosításból.
            
            Közvetlen letöltés az alkalmazáson belülről vagy közvetlenül a böngészőből:
            [BioMatch-xG-latest.apk](https://github.com/${{ github.repository }}/releases/download/v${{ env.APP_VERSION }}/BioMatch-xG-latest.apk)
          draft: false
          prerelease: false
          files: release_apk/BioMatch-xG-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
